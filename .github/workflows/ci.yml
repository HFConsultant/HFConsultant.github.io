name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines, so it is tested
        # rather than assumed -- the previously declared floor of 18 turned out
        # not to work at all, because Node only exposes Web Crypto as a global
        # from 19. 22 is where development happens; 24 catches the next break.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install: the crypto tests run against Node's own
      # Web Crypto implementation, and there is nothing to build.
      - name: Run tests
        run: npm test
