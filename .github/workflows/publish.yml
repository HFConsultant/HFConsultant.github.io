name: Publish to npm

# Publishing is irreversible: a version number can never be reused, even after
# `npm unpublish`. So this never runs on a push. It requires either creating a
# GitHub Release or explicitly starting the workflow by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets npm record a signed link between this tarball and the commit and
      # workflow that produced it, shown as a "Provenance" badge on npm.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Belt and braces: prepublishOnly runs these too, but a failure here is
      # far cheaper than a bad version that can never be reused.
      - name: Run tests
        run: npm test

      - name: Check the version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump the version in package.json."
            exit 1
          fi
          echo "Publishing $NAME@$VERSION"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
