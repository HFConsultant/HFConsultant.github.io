<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

	<!--
		Everything is same-origin: no CDNs, no inline scripts, no inline styles,
		and no connect-src at all. The app cannot make a network request even if
		something managed to inject code into it.
	-->
	<meta http-equiv="Content-Security-Policy" content="default-src 'none';
		script-src 'self';
		style-src 'self';
		img-src 'self' data:;
		manifest-src 'self';
		connect-src 'none';
		form-action 'none';
		base-uri 'none';
		frame-ancestors 'none'">

	<title>Secure Terminal — browser-only text encryption</title>
	<meta name="description"
		content="Encrypt and decrypt text entirely in your browser with AES-256-GCM. No server, no account, no storage. Works offline.">
	<meta name="referrer" content="no-referrer">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#00ff9d">

	<link rel="stylesheet" href="css/style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="icon" href="icons/icon-192x192.png" sizes="192x192">
	<link rel="apple-touch-icon" href="icons/icon-192x192.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
	<main class="terminal">
		<header class="terminal-header">
			<h1>Secure Terminal</h1>
			<p class="terminal-subtitle">AES-256-GCM · in your browser · nothing leaves this device</p>
		</header>

		<!--
			aria-live="polite" so screen readers announce results as they appear.
			The region is a log: additions are read, existing content is not
			re-announced.
		-->
		<div class="terminal-output" role="log" aria-live="polite" aria-label="Terminal output"
			tabindex="0"></div>

		<form class="terminal-input-line" autocomplete="off">
			<label class="terminal-label" for="terminal-input">Command</label>
			<span class="prompt" aria-hidden="true">&gt;</span>
			<input class="terminal-input" id="terminal-input" name="command" type="text"
				autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"
				placeholder="type 'h' for help" aria-label="Terminal command" autofocus>
			<button class="submit-btn" type="submit" aria-label="Run">⏎</button>
		</form>
	</main>

	<noscript>
		<p class="noscript">Secure Terminal needs JavaScript — all the encryption runs in your
			browser, so there is no server to fall back on.</p>
	</noscript>

	<script type="module" src="js/terminal.js"></script>
	<script src="js/register-sw.js" defer></script>
</body>

</html>
